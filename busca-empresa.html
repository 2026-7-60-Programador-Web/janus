<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar egressos — Janus</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="app-header">
    <div class="wrap">
      <div>
        <a class="logo" href="index.html">Janus</a>
        <p class="app-header-meta" id="empresa-nome">Empresa parceira</p>
      </div>
      <div class="app-header-right">
        <a href="login.html">Sair</a>
      </div>
    </div>
  </header>

  <main id="conteudo" class="app-main">
    <div class="wrap">
      <div class="app-card">
        <h1>Buscar egressos</h1>
        <p class="app-intro">Adicione as competências que a vaga exige. Os resultados aparecem ordenados por compatibilidade.</p>

        <div class="field">
          <label for="competencia-desejada">Competências desejadas</label>
          <div class="field-inline" data-skill-widget data-chip-style="info">
            <input type="text" id="competencia-desejada" class="skill-input" placeholder="Ex: Organização">
            <button type="button" class="button button-secondary skill-add-btn">Adicionar</button>
          </div>
          <p class="skill-error" hidden>Digite uma competência antes de adicionar</p>
          <div class="chip-list"></div>
        </div>

        <p class="results-count" id="resultados-contagem">Adicione competências para buscar egressos aprovados</p>

        <ul class="result-list" id="lista-resultados"></ul>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
